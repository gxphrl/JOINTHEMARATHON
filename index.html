<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BIKER — Ficha Técnica</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;min-height:100%;margin:0;padding:0}
body{background:#777;font-family:Arial,Helvetica,sans-serif;color:#111;overflow-x:hidden}
.wrap{width:100%;max-width:none;margin:0;padding:0}
.app{width:100%;min-height:100vh;background:#d2d2cf;border:0;padding:12px;box-shadow:none}
h1{font-size:22px;margin:0 0 4px}
.intro{font-size:11px;font-weight:700;margin-bottom:12px}
.grid{display:grid;grid-template-columns:330px 1fr;gap:12px}
.controls{border:1px solid #222;padding:10px;background:#c2c2c0}
.section{border-bottom:1px solid #777;padding-bottom:10px;margin-bottom:10px}
.section:last-child{border:0}
label{display:block;font-size:9px;font-weight:800;margin:7px 0 3px;text-transform:uppercase}
input,select{width:100%;padding:8px;border:1px solid #555;background:#eee;font-size:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:6px}
button{width:100%;padding:11px;border:2px solid #111;background:#111;color:#fff;font-weight:800;cursor:pointer;margin-top:5px}
button.alt{background:#eee;color:#111}
.stage{background:#999;padding:12px;border:1px solid #222;display:flex;justify-content:center;align-items:flex-start;overflow:auto}
canvas{width:100%;max-width:820px;height:auto;background:#ddd;display:block}
.note{font-size:9px;line-height:1.4;color:#444;margin-top:7px}
@media(max-width:1100px){
 .grid{grid-template-columns:300px 1fr}
}
@media(max-width:850px){
 .app{padding:6px}
 .grid{grid-template-columns:1fr}
 .stage{order:-1;padding:8px}
 canvas{width:100%;height:auto}
}
</style>
</head>
<body>
<div class="wrap">
<div class="app">
<h1>BIKER / FICHA TÉCNICA DE ATLETA</h1>
<div class="intro">GERADOR DE CREDENCIAL • 1080 × 1350 PX</div>

<div class="grid">
<div class="controls">

<div class="section">
<label>Foto</label>
<input id="photo" type="file" accept="image/*">

<label>Nome / Alias</label>
<input id="alias" value="BIKER">

<label>Nome verdadeiro</label>
<input id="realname" value="Desconhecido.">

<label>Idade</label>
<input id="age" value="22 anos">

<label>Nacionalidade</label>
<input id="nation" value="Brasileiro">
</div>

<div class="section">
<div class="two">
<div>
<label>Altura</label>
<input id="height" value="180 cm">
</div>
<div>
<label>Peso</label>
<input id="weight" value="72 kg">
</div>
</div>

<label>ID do atleta</label>
<div style="display:grid;grid-template-columns:1fr 90px;gap:5px">
<input id="athleteId" value="BK-2026-4821">
<button type="button" id="newId" style="margin:0;padding:7px">NOVO</button>
</div>

<label>Categoria</label>
<input id="category" value="BIKER">
</div>

<div class="section">
<label>Cor do documento</label>
<input id="paper" type="color" value="#d2d2cf">

<label>Cor da tipografia</label>
<input id="ink" type="color" value="#111111">

<label>Tratamento da foto</label>
<select id="filter">
<option value="bw">P&B contrastado</option>
<option value="mono">P&B</option>
<option value="normal">Original</option>
<option value="hard">Alto contraste</option>
</select>

<label>Zoom da foto</label>
<input id="zoom" type="range" min="100" max="180" value="100">
</div>

<button id="download">GERAR E BAIXAR PNG</button>
<button class="alt" id="reset">RESETAR</button>

<div class="note">
A ficha final é renderizada em 1080 × 1350 px. A foto é processada localmente no navegador.
</div>
</div>

<div class="stage">
<canvas id="canvas" width="1080" height="1350"></canvas>
</div>
</div>
</div>
</div>

<script>
const $=id=>document.getElementById(id);
const C=$('canvas'),ctx=C.getContext('2d');
const W=1080,H=1350;
let img=null,imageUrl=null;

function val(id){return $(id).value}
function font(size,weight=700){return `${weight} ${size}px Arial, Helvetica, sans-serif`}
function line(x1,y1,x2,y2,lw=1){
 ctx.lineWidth=lw;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
}
function box(x,y,w,h,fill=null,lw=1){
 if(fill){ctx.fillStyle=fill;ctx.fillRect(x,y,w,h)}
 ctx.strokeStyle=val('ink');ctx.lineWidth=lw;ctx.strokeRect(x,y,w,h);
}
function text(t,x,y,size,weight=700,align='left'){
 ctx.font=font(size,weight);ctx.textAlign=align;ctx.textBaseline='alphabetic';ctx.fillStyle=val('ink');ctx.fillText(t,x,y);
}
function photoFilter(){
 const f=val('filter');
 if(f==='bw')return 'grayscale(1) contrast(1.25)';
 if(f==='mono')return 'grayscale(1)';
 if(f==='hard')return 'grayscale(1) contrast(1.8)';
 return 'none';
}
function fitCover(image,x,y,w,h,zoom=1){
 const s=Math.max(w/image.naturalWidth,h/image.naturalHeight)*zoom;
 const nw=image.naturalWidth*s,nh=image.naturalHeight*s;
 ctx.drawImage(image,x+(w-nw)/2,y+(h-nh)/2,nw,nh);
}
function barcode(x,y,w,h){
 let xx=x,seed=31;ctx.fillStyle=val('ink');
 while(xx<x+w){
   seed=(seed*73+41)%101;
   const bw=1+(seed%4);
   ctx.fillRect(xx,y,bw,h);
   xx+=bw+1+(seed%3);
 }
}
function labelValue(label,value,x,y,w){
 text(label,x,y,10,700);
 text(value,x,y+21,18,400);
 line(x,y+31,x+w,y+31,1);
}

function draw(){
 const paper=val('paper'),ink=val('ink');
 ctx.fillStyle=paper;ctx.fillRect(0,0,W,H);
 ctx.strokeStyle=ink;

 // textura
 ctx.save();ctx.globalAlpha=.05;
 for(let i=0;i<6500;i++){
   ctx.fillStyle=i%2?'#000':'#fff';
   ctx.fillRect(Math.random()*W,Math.random()*H,1,1);
 }
 ctx.restore();

 // moldura
 ctx.lineWidth=2;ctx.strokeRect(14,14,W-28,H-28);
 ctx.lineWidth=1;ctx.strokeRect(24,24,W-48,H-48);

 // CABEÇALHO
 ctx.fillStyle='#c5c5c3';ctx.fillRect(32,34,1016,84);
 box(32,34,1016,84,null,2);
 text('FICHA TÉCNICA DE ATLETA',50,72,30,800);
 text('TRIATHLON  |  CREDENCIAL OFICIAL DE ATLETA',50,96,14,800);

 ctx.fillStyle='#eee';ctx.fillRect(860,48,166,55);
 box(860,48,166,55,null,1);
 text('ID ATLETA',874,66,9,700);
 text(val('athleteId'),874,89,17,800);

 // PAINEL ESQUERDO
 const lx=32,ly=128,lw=320,lh=1188;
 ctx.fillStyle='#c4c4c2';ctx.fillRect(lx,ly,lw,lh);
 box(lx,ly,lw,lh,null,1);

 // foto pequena
 box(82,148,220,220,'#aaa',2);
 if(img){
   ctx.save();
   ctx.beginPath();ctx.rect(84,150,216,216);ctx.clip();
   ctx.filter=photoFilter();
   fitCover(img,84,150,216,216,1);
   ctx.restore();
 }else{
   text('UPLOAD',192,258,18,800,'center');
   text('FOTO',192,280,18,800,'center');
 }

 text(val('alias')||'BIKER',192,398,26,800,'center');
 text('CATEGORIA: '+(val('category')||'BIKER'),192,420,14,800,'center');

 text('NOME VERDADEIRO',72,445,9,700);
 text(val('realname')||'—',190,445,13,400);

 // campos básicos
 const cards=[
   ['IDADE',val('age')],
   ['NACIONALIDADE',val('nation')],
   ['ALTURA',val('height')],
   ['PESO',val('weight')]
 ];
 let cy=470;
 cards.forEach(a=>{
   ctx.fillStyle='#ededeb';ctx.fillRect(46,cy,292,55);
   box(46,cy,292,55,null,1);
   text(a[0],57,cy+16,9,700);
   text(a[1]||'—',57,cy+39,16,400);
   cy+=63;
 });

 barcode(72,750,240,38);
 text('VALIDATED ATHLETE PROFILE',192,807,10,700,'center');
 line(55,840,329,840,1);

 text('ID',57,870,9,700);
 text(val('athleteId'),57,894,15,400);

 text('BIKER GENERATOR',192,1245,11,800,'center');
 text('TRIATHLON / TERRORIST ERA*',192,1265,9,700,'center');

 // FOTO PRINCIPAL
 const px=366,py=128,pw=682,ph=790;
 ctx.fillStyle='#ddd';ctx.fillRect(px,py,pw,ph);
 box(px,py,pw,ph,null,1);

 if(img){
   ctx.save();
   ctx.beginPath();ctx.rect(px+1,py+1,pw-2,ph-2);ctx.clip();
   ctx.filter=photoFilter();
   fitCover(img,px+1,py+1,pw-2,ph-2,+val('zoom')/100);
   ctx.restore();
 }else{
   text('SUA FOTO APARECERÁ AQUI',px+pw/2,py+ph/2,22,800,'center');
 }

 // BIOMETRIA
 const sy=930;
 ctx.fillStyle='#c9c9c7';ctx.fillRect(px,sy,pw,330);
 box(px,sy,pw,330,null,1);

 text('1. BIOMETRIA',px+18,sy+30,19,800);
 line(px+18,sy+43,px+pw-18,sy+43,2);

 labelValue('IDADE',val('age'),px+18,sy+70,185);
 labelValue('ALTURA',val('height'),px+225,sy+70,185);
 labelValue('PESO',val('weight'),px+432,sy+70,210);

 labelValue('NACIONALIDADE',val('nation'),px+18,sy+145,300);

 text('CATEGORIA',px+432,sy+145,10,700);
 text(val('category'),px+432,sy+166,18,400);
 line(px+432,sy+176,px+pw-18,sy+176,1);

 text('NOME / ALIAS',px+18,sy+220,10,700);
 text(val('alias'),px+18,sy+245,21,800);

 text('ID DO ATLETA',px+432,sy+220,10,700);
 text(val('athleteId'),px+432,sy+245,17,800);

 barcode(px+18,sy+276,285,28);
 text('ATHLETE PROFILE / VALIDATED',px+315,sy+295,9,700);
 text('NO PAIN / NO GAIN / JUST ART',px+pw-18,sy+295,10,800,'right');
}

document.querySelectorAll('input,select').forEach(el=>el.addEventListener('input',draw));

$('photo').addEventListener('change',e=>{
 const f=e.target.files[0];if(!f)return;
 if(imageUrl)URL.revokeObjectURL(imageUrl);
 imageUrl=URL.createObjectURL(f);
 const im=new Image();
 im.onload=()=>{img=im;draw()};
 im.src=imageUrl;
});

$('newId').addEventListener('click',()=>{
 const year=new Date().getFullYear();
 const num=Math.floor(1000+Math.random()*9000);
 $('athleteId').value='BK-'+year+'-'+num;
 draw();
});

$('download').addEventListener('click',()=>{
 draw();
 const name=(val('alias')||'biker').replace(/[^a-z0-9_-]+/gi,'-').toLowerCase();
 const a=document.createElement('a');
 a.download='ficha-atleta-'+name+'.png';
 a.href=C.toDataURL('image/png');
 a.click();
});

$('reset').addEventListener('click',()=>{
 ['alias','realname','age','nation','height','weight','athleteId','category'].forEach((id,idx)=>{
   const defaults=['BIKER','Desconhecido.','22 anos','Brasileiro','180 cm','72 kg','BK-2026-4821','BIKER'];
   $(id).value=defaults[idx];
 });
 $('paper').value='#d2d2cf';$('ink').value='#111111';
 $('filter').value='bw';$('zoom').value=100;
 $('photo').value='';img=null;
 if(imageUrl)URL.revokeObjectURL(imageUrl);imageUrl=null;
 draw();
});

draw();
</script>
</body>
</html>
